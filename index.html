const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookLink=(page)=>`<a href="${encodeURI(BOOK_FILE)}#page=${page===61?1:page===62?2:page===63?3:page===64?4:page===65?5:6}" target="_blank" rel="noopener">📖 Відкрити підручник (PDF)</a>`;
const bar=n=>`<div class="progress"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div>`;
function welcome(){phase='welcome';H.textContent='Початок';S.innerHTML=`<div class="eyebrow">Операція «Введення» • версія 2.1</div><h1>🕵️ Цифровий детектив</h1><p>У комп’ютерній лабораторії переплутано технічні паспорти пристроїв. Досліджуй підручник і відновлюй дані: класифікуй, порівнюй, виправляй помилки та розв’язуй практичні ситуації.</p><div class="tags"><span class="tag">4 навчальні місії</span><span class="tag">Різні типи завдань</span><span class="tag">12 контрольних завдань</span><span class="tag">До 12 балів</span></div><div class="note">Спочатку самостійно опрацьовуй вказані сторінки. На тренувальних місіях можна виправляти відповіді — вони <b>не впливають на оцінку</b>. У контрольній частині підказок немає. ${bookLink(61)}</div><label for="username">Прізвище та ім’я</label><input id="username" maxlength="90" placeholder="Петренко Олена" value="${esc(student)}"><label for="studentclass">Клас</label><select id="studentclass" style="width:100%;font:inherit;padding:13px;border:2px solid #c4d6e5;border-radius:10px"><option value="8-А">8-А</option><option value="8-Б">8-Б</option><option value="8-В">8-В</option></select><div class="actions"><button onclick="start()">Розпочати місії →</button></div><p class="muted small">Для відкриття підручника тримай PDF поруч із HTML-файлом. Коли вчитель підключить Google Таблицю, результати надсилатимуться автоматично за наявності інтернету.</p>`}
function start(){let n=document.getElementById('username').value.trim().replace(/\s+/g,' ');if(n.length<5||!n.includes(' ')){alert('Введи прізвище та ім’я.');return}student=n;studentClass=document.getElementById('studentclass').value;sessionId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);missionIndex=0;taskIndex=0;misses=0;examIndex=0;examAnswers=[];training()}
function answerMarkup(t,existing){if(t.type==='single'||t.type==='multi'){let multi=t.type==='multi';return t.options.map((v,i)=>`<label class="taskCard"><input name="${multi?'choice'+i:'ans'}" type="${multi?'checkbox':'radio'}" value="${i}" ${multi?(Array.isArray(existing)&&existing.includes(i)?'checked':''):(existing===i?'checked':'')}><span>${esc(v)}</span></label>`).join('')}
if(t.type==='sort'||t.type==='match')return t.items.map((it,i)=>`<div class="taskCard"><label for="s${i}">${i+1}. ${esc(it[0])}</label><select id="s${i}"><option value="">— Обери відповідь —</option>${t.options.map((o,j)=>`<option value="${j}" ${Array.isArray(existing)&&existing[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('');return ''}
function readAnswer(t){if(t.type==='single'){let x=S.querySelector('input[type=radio]:checked');return x?Number(x.value):null}if(t.type==='multi')return [...S.querySelectorAll('input[type=checkbox]:checked')].map(x=>Number(x.value));return t.items.map((_,i)=>{let v=document.getElementById('s'+i).value;return v===''?null:Number(v)})}
function valid(t,v){return t.type==='single'?v!==null:t.type==='multi'?v.length>0:v.every(x=>x!==null)}
function correct(t,v){let c=t.type==='sort'?t.items.map(x=>x[1]):t.correct;return Array.isArray(c)?Array.isArray(v)&&c.length===v.length&&c.every(x=>v.includes(x))&&(t.type==='multi'||c.every((x,i)=>v[i]===x)):v===c}
function explanation(t){let c=t.type==='sort'?t.items.map(x=>x[1]):t.correct;if(t.type==='single')return t.options[c];if(t.type==='multi')return c.map(i=>t.options[i]).join('; ');return t.items.map((x,i)=>x[0]+' → '+t.options[c[i]]).join('; ')}
function training(){phase='training';let m=missions[missionIndex],t=m.tasks[taskIndex];H.textContent=`Навчальна місія ${missionIndex+1}/4`;S.innerHTML=`<div class="eyebrow">Місія ${missionIndex+1} з 4 • Завдання ${taskIndex+1} з 3</div><h2>${esc(m.name)}</h2>${bar((missionIndex*3+taskIndex)/12*70)}<div class="note"><b>Досліди:</b> ${esc(m.focus)} (с. ${m.pages}). Читай підручник, знаходь пояснення та застосовуй інформацію. <p>${bookLink(Number(m.pages.slice(0,2)))}</p></div><div class="subhead">${esc(t.title)}</div><div class="question">${esc(t.prompt)}</div><div id="task">${answerMarkup(t,null)}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="check" onclick="checkTraining()">Перевірити відповідь</button><button id="next" class="hide" onclick="nextTraining()">${missionIndex===3&&taskIndex===2?'До контрольної місії →':'Продовжити →'}</button></div>`}
function checkTraining(){let t=missions[missionIndex].tasks[taskIndex],v=readAnswer(t);if(!valid(t,v)){alert('Заповни відповідь.');return}let ok=correct(t,v),f=document.getElementById('feedback');if(ok){f.innerHTML='<div class="feedback good">✅ Доказ підтверджено! Рухайся далі.</div>';document.getElementById('check').disabled=true;document.getElementById('next').classList.remove('hide');S.querySelectorAll('#task input,#task select').forEach(el=>el.disabled=true)}else{misses++;f.innerHTML='<div class="feedback bad">🔎 Є неточність. Повернися до відповідної сторінки підручника, порівняй варіанти й спробуй знову. Помилка не впливає на оцінку.</div>'}}
function nextTraining(){taskIndex++;if(taskIndex>=3){taskIndex=0;missionIndex++}if(missionIndex>=4)examIntro();else training()}
function examIntro(){phase='intro';H.textContent='Контрольна місія';S.innerHTML=`<div class="eyebrow">Навчальні місії виконано</div><h1>🔐 Контрольна місія</h1>${bar(70)}<p>Тепер перевір, чи зможеш <b>застосувати знання</b>. Тут 12 різнотипних завдань: не тільки тести, а й сортування, пошук усіх правильних або помилкових тверджень, установлення відповідностей і ситуації.</p><div class="note amber"><b>Правила:</b> 1 повністю правильне завдання = 1 бал; максимум — 12. Завдання оцінюються цілком: у множинному виборі потрібно позначити всі потрібні пункти й жодного зайвого. До завершення тесту можна повернутися до попереднього завдання.</div><button onclick="showExam()">Розпочати контрольну місію →</button>`}
function showExam(){phase='exam';H.textContent=`Контрольна ${examIndex+1}/12`;let t=exam[examIndex];S.innerHTML=`<div class="eyebrow">Контрольна місія • ${examIndex+1} з 12</div><h2>${esc(t.title)}</h2>${bar(70+30*examAnswers.filter(x=>x!==undefined).length/12)}<p class="muted">${esc(t.type==='match'?'Зіставлення':t.type==='sort'?'Класифікація':t.type==='multi'?'Кілька відповідей':'Вибір одного варіанта')}</p><div class="question">${esc(t.prompt)}</div><div id="task">${answerMarkup(t,examAnswers[examIndex])}</div><div class="actions"><button class="secondary" onclick="moveExam(-1)" ${examIndex===0?'disabled':''}>← Назад</button><button onclick="moveExam(1)">${examIndex===11?'Завершити тест':'Далі →'}</button></div><p class="mutedMini">Можеш змінювати відповіді та повертатися до попередніх завдань. Правильні відповіді побачиш після отримання оцінки.</p>`}
function moveExam(dir){let t=exam[examIndex],v=readAnswer(t);if(dir>0&&!valid(t,v)){alert('Спочатку заповни всі поля цього завдання.');return}if(valid(t,v))examAnswers[examIndex]=v;if(examIndex+dir<12&&examIndex+dir>=0){examIndex+=dir;showExam()}else if(dir>0)finish()}
function finish(){if(examAnswers.length<12||examAnswers.some((x,i)=>!valid(exam[i],x))){alert('Не всі завдання заповнено.');return}let score=exam.reduce((n,t,i)=>n+Number(correct(t,examAnswers[i])),0);let data={date:new Date().toLocaleString('uk-UA'),name:student,studentClass:studentClass,sessionId:sessionId,score,total:12,wrongLearningAttempts:misses,answers:examAnswers.map((v,i)=>JSON.stringify(v)).join(' | ')};lastResult=data;result();if(RESULTS_ENDPOINT){fetch(RESULTS_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(()=>{let x=document.getElementById('sendNote');if(x)x.textContent='Запит на надсилання виконано. Через режим no-cors підтвердити запис неможливо: перевір Google Таблицю.'}).catch(()=>{let x=document.getElementById('sendNote');if(x)x.textContent='Помилка мережі. Збережи результат у файл.'})}}
function result(){phase='result';H.textContent='Місія завершена';let d=lastResult;S.innerHTML=`<div class="eyebrow">Операцію завершено</div><h1>🧩 Справу розкрито!</h1>${bar(100)}<p><b>${esc(d.name)} (${esc(d.studentClass)})</b>, ти завершив(-ла) самостійне дослідження.</p><div class="stat-grid"><div class="stat"><b>${d.score}</b>Оцінка / 12</div><div class="stat"><b>${Math.round(d.score/12*100)}%</b>Точність</div><div class="stat"><b>12</b>Завдань</div></div><div class="note success">Оцінювалися тільки контрольні завдання. Помилки під час навчання бал не знижували.</div><div id="sendNote" class="note amber">${RESULTS_ENDPOINT?'Виконується запит на надсилання. Попроси вчителя перевірити Google Таблицю — підтвердження запису недоступне.':'Google Таблицю ще не підключено. Збережи результат і передай учителю.'}</div><div class="actions"><button onclick="downloadResult()">⬇ Зберегти результат</button><button class="secondary" onclick="review()">Переглянути розбір →</button></div><p class="muted small">${esc(d.date)}</p>`}
function downloadResult(){let d=lastResult,content=`Інформатика, 8 клас — Пристрої введення даних\nУчень: ${d.name}\nКлас: ${d.studentClass}\nДата: ${d.date}\nОцінка: ${d.score}/12\nПравильних завдань: ${d.score}\nВідповіді: ${d.answers}\n`;let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='Результат_'+d.name.replace(/[^\p{L}\p{N}]+/gu,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function review(){H.textContent='Розбір';S.innerHTML=`<div class="eyebrow">Аналіз результатів</div><h2>Правильні відповіді</h2><p>Оцінка <b>${lastResult.score}/12</b></p>${exam.map((t,i)=>`<div class="taskCard"><b>${i+1}. ${esc(t.title)}</b><p class="mutedMini">${esc(t.prompt)}</p><div class="feedback ${correct(t,examAnswers[i])?'good':'bad'}">${correct(t,examAnswers[i])?'✅ Правильно':'❌ Є помилка'}<div><b>Правильна відповідь:</b> ${esc(explanation(t))}</div></div></div>`).join('')}<button onclick="result()">← До результату</button>`}
welcome();
</script></body></html>
